databases:
  - name: ai-workforce-db
    databaseName: ai_workforce
    user: ai_workforce_user
    plan: free

  - name: ai-workforce-redis
    plan: free
    ipAllowList: [] # only allow internal connections

services:
  - type: web
    name: ai-workforce-api-and-worker
    env: node
    plan: free
    buildCommand: corepack enable pnpm && pnpm install && pnpm --filter api build && pnpm --filter worker build
    startCommand: pnpm --filter api start & pnpm --filter worker start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: ai-workforce-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: ai-workforce-redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://ai-workforce-platform-web.vercel.app # Replace if your frontend URL changes
