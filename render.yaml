services:
  # Backend API Service
  - type: web
    name: ai-workforce-api
    env: node
    rootDir: apps/api
    buildCommand: npm install -g pnpm && pnpm install --filter api... && pnpm --filter api run build
    startCommand: pnpm --filter api run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false

  # Frontend Web Service
  - type: web
    name: ai-workforce-web
    env: node
    rootDir: apps/web
    buildCommand: npm install -g pnpm && pnpm install --filter web... && pnpm --filter web run build
    startCommand: pnpm --filter web run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_URL
        sync: false
